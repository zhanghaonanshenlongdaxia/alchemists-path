<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="liquid" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff8888"/>
      <stop offset="100%" stop-color="#cc2222"/>
    </radialGradient>
    <radialGradient id="glass" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </radialGradient>
  </defs>
  <!-- Bottle body -->
  <path d="M22 28 L18 50 Q18 58 32 58 Q46 58 46 50 L42 28 Z" fill="url(#liquid)" stroke="#881111" stroke-width="1.5"/>
  <!-- Liquid shine -->
  <ellipse cx="27" cy="44" rx="4" ry="7" fill="rgba(255,200,200,0.3)"/>
  <!-- Glass overlay -->
  <path d="M22 28 L18 50 Q18 58 32 58 Q46 58 46 50 L42 28 Z" fill="url(#glass)"/>
  <!-- Neck -->
  <rect x="26" y="18" width="12" height="12" rx="2" fill="#dd3333" stroke="#881111" stroke-width="1.5"/>
  <!-- Cork -->
  <rect x="27" y="12" width="10" height="8" rx="3" fill="#cc9944" stroke="#885522" stroke-width="1"/>
  <!-- Plus sign -->
  <line x1="32" y1="37" x2="32" y2="51" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="44" x2="39" y2="44" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sparkle -->
  <circle cx="44" cy="22" r="2" fill="#ffaaaa"/>
  <circle cx="40" cy="18" r="1.2" fill="#ffcccc"/>
</svg>
