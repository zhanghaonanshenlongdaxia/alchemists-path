<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeeeff"/>
      <stop offset="50%" stop-color="#aabbdd"/>
      <stop offset="100%" stop-color="#556688"/>
    </linearGradient>
  </defs>
  <!-- Blade -->
  <polygon points="32,6 29,48 32,52 35,48" fill="url(#blade)" stroke="#334455" stroke-width="1"/>
  <!-- Shine -->
  <line x1="31" y1="10" x2="30" y2="45" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Guard -->
  <rect x="20" y="47" width="24" height="5" rx="2" fill="#cc9944" stroke="#886622" stroke-width="1"/>
  <!-- Handle -->
  <rect x="28" y="52" width="8" height="12" rx="2" fill="#884422" stroke="#553311" stroke-width="1"/>
  <!-- Pommel -->
  <ellipse cx="32" cy="64" rx="5" ry="3" fill="#cc9944" stroke="#886622" stroke-width="1"/>
  <!-- Enchant glow -->
  <ellipse cx="32" cy="28" rx="3" ry="18" fill="rgba(100,150,255,0.08)"/>
</svg>
