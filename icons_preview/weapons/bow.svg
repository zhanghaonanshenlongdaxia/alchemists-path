<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aa6622"/>
      <stop offset="100%" stop-color="#663300"/>
    </linearGradient>
  </defs>
  <!-- Bow arc -->
  <path d="M20 8 Q8 32 20 56" stroke="url(#wood)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- String -->
  <line x1="20" y1="8" x2="20" y2="56" stroke="rgba(200,200,200,0.8)" stroke-width="1.2"/>
  <!-- Arrow -->
  <line x1="20" y1="32" x2="54" y2="32" stroke="#cc9944" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="54,32 48,28 48,36" fill="#aabbcc" stroke="#556677" stroke-width="1"/>
  <!-- Arrow fletching -->
  <path d="M22 32 L18 28 M22 32 L18 36" stroke="#ee4444" stroke-width="2" stroke-linecap="round"/>
  <!-- Bow grip wrap -->
  <rect x="17" y="28" width="6" height="8" rx="1" fill="#885533" stroke="#553311" stroke-width="0.5"/>
  <!-- Glint on bow -->
  <circle cx="12" cy="18" r="1.5" fill="rgba(255,255,255,0.5)"/>
</svg>
