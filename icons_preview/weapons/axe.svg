<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddddee"/>
      <stop offset="100%" stop-color="#778899"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
  <rect x="30" y="28" width="5" height="32" rx="2" fill="#884422" stroke="#553311" stroke-width="1"/>
  <!-- Axe head -->
  <path d="M20 10 Q14 20 18 32 L32 30 L34 10 Z" fill="url(#blade)" stroke="#445566" stroke-width="1.5"/>
  <!-- Axe edge highlight -->
  <path d="M18 14 Q13 22 17 30" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Spike on top -->
  <polygon points="34,10 32,4 30,10" fill="url(#blade)" stroke="#445566" stroke-width="1"/>
  <!-- Pommel -->
  <ellipse cx="32" cy="60" rx="4" ry="3" fill="#cc9944" stroke="#886622" stroke-width="1"/>
  <!-- Rune engraving -->
  <path d="M22 18 L26 22 L22 26" stroke="rgba(100,150,255,0.5)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Glint -->
  <circle cx="17" cy="16" r="2" fill="rgba(255,255,255,0.8)"/>
</svg>
