<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gem" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#88ffff"/>
      <stop offset="100%" stop-color="#006688"/>
    </radialGradient>
  </defs>
  <!-- Ring band -->
  <circle cx="32" cy="38" r="16" fill="none" stroke="#cc9944" stroke-width="7"/>
  <circle cx="32" cy="38" r="16" fill="none" stroke="#ffdd66" stroke-width="2"/>
  <circle cx="32" cy="38" r="12" fill="none" stroke="#886622" stroke-width="1"/>
  <!-- Gem setting -->
  <rect x="25" y="14" width="14" height="14" rx="3" fill="#cc9944" stroke="#886622" stroke-width="1.5"/>
  <!-- Gem -->
  <polygon points="32,16 38,22 32,28 26,22" fill="url(#gem)" stroke="#006688" stroke-width="1"/>
  <polygon points="32,17 37,22 32,24" fill="rgba(200,255,255,0.5)"/>
  <!-- Gem facets -->
  <line x1="32" y1="16" x2="32" y2="28" stroke="rgba(0,100,130,0.3)" stroke-width="0.8"/>
  <!-- Sparkles -->
  <circle cx="40" cy="14" r="2" fill="#aaffff"/>
  <circle cx="46" cy="20" r="1.5" fill="#88ddff"/>
  <circle cx="42" cy="8" r="1" fill="#ccffff"/>
</svg>
