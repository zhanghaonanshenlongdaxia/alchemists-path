<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gem" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffaacc"/>
      <stop offset="100%" stop-color="#882244"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,100,150,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <!-- Glow -->
  <circle cx="32" cy="38" r="22" fill="url(#glow)"/>
  <!-- Chain -->
  <path d="M32 8 Q14 12 12 28" stroke="#cc9944" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 8 Q50 12 52 28" stroke="#cc9944" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Chain links -->
  <circle cx="20" cy="16" r="2" fill="none" stroke="#cc9944" stroke-width="1.5"/>
  <circle cx="44" cy="16" r="2" fill="none" stroke="#cc9944" stroke-width="1.5"/>
  <!-- Pendant base -->
  <path d="M18 30 L32 58 L46 30 Q46 22 32 22 Q18 22 18 30 Z" fill="#cc9944" stroke="#886622" stroke-width="1.5"/>
  <!-- Gem -->
  <polygon points="32,28 40,36 32,52 24,36" fill="url(#gem)" stroke="#cc4488" stroke-width="1"/>
  <!-- Gem shine -->
  <polygon points="32,30 37,36 32,34" fill="rgba(255,220,230,0.5)"/>
  <!-- Top circle -->
  <circle cx="32" cy="8" r="4" fill="#cc9944" stroke="#886622" stroke-width="1.5"/>
  <circle cx="32" cy="8" r="2" fill="#ffdd66"/>
