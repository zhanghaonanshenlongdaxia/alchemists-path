<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ddbbff"/>
      <stop offset="50%" stop-color="#7733cc"/>
      <stop offset="100%" stop-color="#220044"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(180,100,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <!-- Orb -->
  <circle cx="32" cy="32" r="22" fill="url(#orb)" stroke="#5511aa" stroke-width="1.5"/>
  <!-- Shine -->
  <ellipse cx="24" cy="22" rx="7" ry="5" fill="rgba(255,255,255,0.25)" transform="rotate(-20,24,22)"/>
  <ellipse cx="22" cy="20" rx="3" ry="2" fill="rgba(255,255,255,0.4)" transform="rotate(-20,22,20)"/>
  <!-- Magical swirls -->
  <path d="M20 36 Q28 28 36 36 Q44 44 36 52" stroke="rgba(200,150,255,0.5)" stroke-width="1.5" fill="none"/>
  <path d="M26 20 Q34 28 26 36" stroke="rgba(200,150,255,0.4)" stroke-width="1" fill="none"/>
  <!-- Stars inside -->
  <circle cx="38" cy="26" r="1.5" fill="rgba(255,255,255,0.6)"/>
  <circle cx="26" cy="38" r="1" fill="rgba(255,255,255,0.5)"/>
  <circle cx="40" cy="40" r="1" fill="rgba(255,255,255,0.4)"/>
  <!-- Outer sparkles -->
  <circle cx="10" cy="14" r="2" fill="#cc88ff"/>
  <circle cx="54" cy="12" r="1.5" fill="#ddaaff"/>
  <circle cx="8" cy="50" r="1.5" fill="#cc88ff"/>
  <circle cx="56" cy="48" r="1" fill="#ddaaff"/>
</svg>
