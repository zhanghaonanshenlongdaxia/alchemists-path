<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alchemist's Path</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="sprites.js"></script>
    <script src="audio.js"></script>
    <script src="gamedata.js"></script>
    <script src="icons_embedded.js"></script>
    <script src="game.js"></script>
    <script>
    // ========== APK HOT UPDATE SYSTEM ==========
    // Checks remote version 5s after start, downloads & caches new game.js via Cache API
    var REMOTE_BASE = 'https://zhanghaonanshenlongdaxia.github.io/alchemists-path/';
    var _HU_CACHE_NAME = 'alchemist-hot-update-v1';
    var _HU_VER_KEY = 'alchemist_hu_ver';

    function _huExtractVer(src){
        var m=src.match(/var GAME_VERSION\s*=\s*'([^']+)'/);
        return m?m[1]:null;
    }

    function _huShowToast(ver){
        var toast=document.createElement('div');
        toast.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:2px solid #44dd88;color:#fff;padding:12px 20px;border-radius:8px;z-index:999997;font-family:monospace;font-size:13px;text-align:center;min-width:240px;box-shadow:0 4px 20px rgba(0,0,0,0.6);';
        toast.innerHTML='<div style="color:#44dd88;font-weight:bold;margin-bottom:8px;">\uD83D\uDD04 \u53d1\u73b0\u65b0\u7248\u672c '+ver+'</div>'
            +'<div style="color:#aaa;font-size:11px;margin-bottom:10px;">\u5df2\u4e0b\u8f7d\uff0c\u91cd\u542f\u540e\u751f\u6548</div>'
            +'<button onclick="window.location.reload()" style="background:#44dd88;color:#000;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-weight:bold;font-family:monospace;font-size:13px;">\u7acb\u5373\u91cd\u542f</button>'
            +'<button onclick="this.parentElement.remove()" style="background:#444;color:#aaa;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-family:monospace;font-size:12px;margin-left:6px;">\u7a0d\u540e</button>';
        document.body.appendChild(toast);
    }

    function _huCheckRemote(){
        var curVer = localStorage.getItem(_HU_VER_KEY) || (typeof GAME_VERSION!=='undefined'?GAME_VERSION:'');
        fetch(REMOTE_BASE+'game.js?_='+Date.now(), {cache:'no-store'})
            .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
            .then(function(code){
                var remoteVer = _huExtractVer(code);
                if(remoteVer && remoteVer !== curVer){
                    // Send to SW to store in hot cache (SW will serve it on next reload)
                    if(navigator.serviceWorker && navigator.serviceWorker.controller){
                        navigator.serviceWorker.controller.postMessage({action:'hotUpdate', code:code});
                    }
                    localStorage.setItem(_HU_VER_KEY, remoteVer);
                    _huShowToast(remoteVer);
                }
            }).catch(function(){});
    }

    setTimeout(_huCheckRemote, 5000);
    </script>
    <div id="updateModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:99999;justify-content:center;align-items:center;">
        <div style="background:#1a1a2e;padding:30px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:320px;text-align:center;border:2px solid #44dd88;">
            <div style="color:#44dd88;font-size:24px;margin-bottom:10px;">🔄</div>
            <h3 style="color:#fff;margin:10px 0;font-family:monospace;">发现新版本</h3>
            <p style="color:#aaa;font-size:14px;margin:15px 0;font-family:monospace;">检测到游戏更新，是否立即更新？</p>
            <div id="updateProgress" style="display:none;margin:15px 0;">
                <div style="background:#333;height:20px;border-radius:10px;overflow:hidden;margin:10px 0;">
                    <div id="progressBar" style="background:linear-gradient(90deg,#44dd88,#4488ee);height:100%;width:0%;transition:width 0.3s;"></div>
                </div>
                <p id="progressText" style="color:#888;font-size:12px;font-family:monospace;">准备更新...</p>
            </div>
            <div id="updateButtons">
                <button onclick="startUpdate()" style="background:#44dd88;color:#000;border:none;padding:12px 30px;border-radius:6px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px;font-family:monospace;">立即更新</button>
                <button onclick="closeUpdateModal()" style="background:#555;color:#fff;border:none;padding:12px 30px;border-radius:6px;font-size:16px;cursor:pointer;margin:5px;font-family:monospace;">稍后提醒</button>
            </div>
        </div>
    </div>
    <script>
    var pendingUpdate = null;
    var updateModal = document.getElementById('updateModal');
    var updateProgress = document.getElementById('updateProgress');
    var updateButtons = document.getElementById('updateButtons');
    var progressBar = document.getElementById('progressBar');
    var progressText = document.getElementById('progressText');
    
    function showUpdateModal(){
        updateModal.style.display = 'flex';
    }
    
    function closeUpdateModal(){
        updateModal.style.display = 'none';
        // Remind again in 5 minutes if not updated
        setTimeout(function(){ if(pendingUpdate) showUpdateModal(); }, 300000);
    }
    
    function startUpdate(){
        updateButtons.style.display = 'none';
        updateProgress.style.display = 'block';
        var progress = 0;
        var interval = setInterval(function(){
            progress += Math.random() * 15 + 5;
            if(progress >= 100) progress = 100;
            progressBar.style.width = progress + '%';
            if(progress < 30) progressText.textContent = '正在下载更新...';
            else if(progress < 70) progressText.textContent = '正在安装更新...';
            else if(progress < 100) progressText.textContent = '即将完成...';
            else {
                progressText.textContent = '更新完成！正在重启...';
                clearInterval(interval);
                setTimeout(function(){
                    if(pendingUpdate) pendingUpdate.postMessage({action:'skipWaiting'});
                    window.location.reload();
                }, 500);
            }
        }, 200);
    }
    
    if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js').then(function(reg){
            // Check for updates every 30 seconds
            setInterval(function(){ reg.update(); }, 30000);
            reg.addEventListener('updatefound', function(){
                var nw = reg.installing;
                pendingUpdate = nw;
                nw.addEventListener('statechange', function(){
                    if(nw.state === 'installed' && navigator.serviceWorker.controller){
                        // New version available, show modal
                        showUpdateModal();
                    }
                });
            });
        });
        // Handle controller change
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function(){
            if(!refreshing){
                refreshing = true;
                window.location.reload();
            }
        });
    }
    </script>
    <div id="_dbgBox" style="display:none;position:fixed;bottom:0;left:0;right:0;max-height:160px;overflow-y:auto;background:rgba(0,0,0,0.92);z-index:999999;padding:6px;font-family:monospace;font-size:11px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="color:#ff4444;font-weight:bold;">ERROR LOG</span>
            <button onclick="document.getElementById('_dbgBox').style.display='none'" style="background:#555;color:#fff;border:none;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px;">✕ 关闭</button>
        </div>
        <div id="_dbgLog"></div>
    </div>
    <script>
    var _dbgBox=document.getElementById('_dbgBox');
    var _dbgLog=document.getElementById('_dbgLog');
    function _dbgAppend(msg,color){
        _dbgBox.style.display='block';
        var d=document.createElement('div');
        d.style.cssText='color:'+(color||'#ff8888')+';border-bottom:1px solid #333;padding:2px 0;word-break:break-all;';
        d.textContent=msg;
        _dbgLog.appendChild(d);
        _dbgBox.scrollTop=_dbgBox.scrollHeight;
    }
    window.addEventListener('error',function(e){_dbgAppend('[ERR] '+(e.message||e)+(e.filename?' @'+e.filename.split('/').pop()+':'+(e.lineno||''):''));});
    window.addEventListener('unhandledrejection',function(e){_dbgAppend('[PROMISE] '+(e.reason&&e.reason.message?e.reason.message:String(e.reason)));});
    </script>
</body>
</html>
